<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Les boutiques — Maison Léone</title>
<meta name="description" content="Les 50 boutiques Maison Léone et le stock de chaque soin.">
<meta name="theme-color" content="#FCF6F0">
<link rel="icon" href="assets/logo/favicon.ico" sizes="any">
<link rel="stylesheet" href="css/fonts.css">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/pages.css">
</head>
<body class="int">
<noscript><p style="padding:6rem 1.5rem 2rem;max-width:40rem;margin:auto;font:1.1rem/1.5 sans-serif">Ce site a besoin de JavaScript pour afficher les soins. Activez-le dans votre navigateur, puis rechargez la page.</p></noscript>
<main class="page" id="contenu">
  <div class="interieur">
    <h1 id="titre">Cinquante boutiques</h1>
    <p class="chapo" id="chapo">Retirez une commande, réservez un soin pour l'essayer, ou venez simplement demander conseil.</p>
    <div class="bout">
      <div class="carte-fr"><svg id="carte" viewBox="0 0 10.4 10.3" role="img" aria-label="Carte de France des 50 boutiques"></svg></div>
      <div>
        <div class="detail-b" id="detail" aria-live="polite" hidden></div>
        <div class="ligne-a" style="margin-bottom:1rem">
          <label class="champ" style="flex:1 1 14rem">Ville ou code postal<input type="search" id="cherche" placeholder="Lyon, 33000…" autocomplete="off"></label>
          <label id="l-stock" hidden style="display:flex;gap:.5rem;align-items:center;align-self:end;padding-bottom:.7rem"><input type="checkbox" id="en-stock" style="accent-color:#0C4236;width:1.1rem;height:1.1rem"> En stock seulement</label>
        </div>
        <p id="nb" role="status" style="color:#4F5A3E;font-size:.92rem;margin-bottom:.4rem"></p>
        <ul class="liste-b" id="liste"></ul>
        <p class="fictif" style="margin-top:1.5rem">Les villes existent, les adresses et les stocks sont inventés pour la maquette.</p>
      </div>
    </div>
  </div>
</main>
<script type="module" src="js/boutiques.js"></script>
</body>
</html>
